# Supabase config. Generated for local dev; production values come from `supabase link`.

project_id = "pulse"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["pulse://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Production: enable Apple + Google via `supabase secrets set` and add provider blocks here.

# User-facing functions: require JWT.
[functions.find-spots]
verify_jwt = true

[functions.plan-day]
verify_jwt = true

[functions.events-feed]
verify_jwt = true

[functions.log-interaction]
verify_jwt = true

# Cron-only: no JWT; protected by x-ingest-secret header instead.
[functions.ingest-events]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"
