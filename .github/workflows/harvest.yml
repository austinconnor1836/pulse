name: harvest-free-things

# $0 to run: GitHub Actions cron (free for the repo) is the entire "backend".
# It runs the harvester and commits output/{city}.json, which the app fetches
# as a static file (raw.githubusercontent.com — free CDN, no server).

on:
  schedule:
    - cron: "0 11 * * *"   # ~6am Central — refresh "today"
    - cron: "0 22 * * *"   # ~5pm Central — refresh "tomorrow"
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Harvest each city
        working-directory: harvester
        run: |
          for city in cities/*.json; do
            id="$(basename "$city" .json)"
            echo "== harvesting $id =="
            node harvest.mjs "$id" || echo "harvest failed for $id (continuing)"
          done
      - name: Commit refreshed data
        run: |
          git config user.name "pulse-harvester[bot]"
          git config user.email "harvester@users.noreply.github.com"
          git add harvester/output/*.json
          git diff --cached --quiet || git commit -m "data: refresh free-things [skip ci]"
          git push
